# @package task
defaults:
  - /task/G1/G1_unified_support_reach_v2
  - _self_

name: G1UnifiedSupportTeaching
command:
  # Half of episodes retain the established left-foot reaching behavior;
  # half use collision- and contact-checked moving root/hand references.
  dataset:
    mem_paths: [wall_foot_reach/train, unified_support/train]
    path_weights: [0.5, 0.5]
  foot_force:
    enabled: false
  aux_support_force:
    enabled: false
reward:
  tracking:
    root_pos_tracking: {weight: 8.0}
    wall_hand_tracking: {weight: 8.0}
    joint_pos_tracking: {weight: 1.0}
